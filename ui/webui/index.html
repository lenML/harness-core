    const timeAgo = t => { if (!t) return ""; const d = Date.now() - t; if (d < 6e4) return "now"; if (d < 36e5) return (d / 6e4 | 0) + "m"; if (d < 864e5) return (d / 36e5 | 0) + "h"; return new Date(t).toLocaleDateString() }
    const fmtBytes = b => { if (!b) return "0 B"; const u = ["B", "KB", "MB", "GB"]; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++ } return b.toFixed(1) + " " + u[i] }
    const fmtDur = ms => { if (!ms) return "0s"; const s = ms / 1e3 | 0, m = s / 60 | 0, h = m / 60 | 0, d = h / 24 | 0; return d > 0 ? d + "d " + h % 24 + "h" : h > 0 ? h + "h " + m % 60 + "m" : m > 0 ? m + "m " + s % 60 + "s" : s + "s" }

    /* ═══════ 主题 ═══════ */
    const DAISY_THEMES = [
      { id: "dark", name: "Dark" }, { id: "night", name: "Night" }, { id: "forest", name: "Forest" },
      { id: "business", name: "Business" }, { id: "dracula", name: "Dracula" }, { id: "black", name: "Black" },

      { id: "default", name: "Default", cls: "size-default" },
      { id: "comfort", name: "Comfortable", cls: "size-comfort" },
      { id: "large", name: "Large Text", cls: "size-large" },

    const applyTheme = id => { document.documentElement.setAttribute("data-theme", id); localStorage.setItem("gw_th", id) }
    const applySize = id => { const m = SIZE_MODES.find(s => s.id === id); if (m) { document.body.className = m.cls; localStorage.setItem("gw_sz", id) } }
    const loadTheme = () => localStorage.getItem("gw_th") || "dark"
    const loadSize = () => localStorage.getItem("gw_sz") || "default"
    const loadEps = () => { try { return JSON.parse(localStorage.getItem("gw_ep") || "[]") } catch { return [] } }
    const saveEps = l => { try { localStorage.setItem("gw_ep", JSON.stringify(l)) } catch { } }

    /* ═══════ Zustand Store ═══════ */
    const useStore = create(set => ({
      connected: false, connecting: false, authFailed: false, authReason: "", gatewayVersion: "",
      endpoints: loadEps(), activeEpId: null,
      sessions: [], activeSK: null, sMsgs: {}, sLoaded: {},
      inputText: "", viewMode: "preview", askQueue: [], activeTab: "chat",
      procKeys: {}, models: {}, curModel: null, tools: [], skills: [], agents: [], bindings: [],
      channels: [], config: null, workdir: null, cron: [],
      channel: "websocket", peerId: "ws-client",
      stats: null, toolStats: [], sidebarOpen: true, themeId: loadTheme(), sizeId: loadSize(),
    }))

    /* ═══════ Gateway Client ═══════ */
    class GW {
      constructor() { this.ws = null; this.nid = 1; this.pen = new Map(); this.rt = false; this.url = ""; this.tk = ""; this.pmap = {} }
      async connect(url, token) {
        this.rt = true; this.url = url; this.tk = token;
        useStore.setState({ connecting: true, connected: false, authFailed: false, authReason: "" })

          const full = url + (url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(token)

      schedule() { const d = Math.min(1e3 * Math.pow(2, this.rc || 0), 3e4); this.rc = (this.rc || 0) + 1; this._rt = setTimeout(() => this.connect(this.url, this.tk), d) }

      async req(m, p = {}) {
        const id = this.nid++
        return new Promise((resolve, reject) => {
          if (!this.ws || this.ws.readyState !== 1) { reject(Error("Not connected")); return }
          this.pen.set(id, { resolve, reject })
          this.ws.send(JSON.stringify({ jsonrpc: "2.0", id, method: m, params: p }))
          setTimeout(() => { if (this.pen.delete(id)) reject(Error("Timeout")) }, 3e4)
        })
      }
      handle(m) { if (m.method) this.notify(m.method, m.params); else if (m.id != null) { const p = this.pen.get(m.id); if (p) { this.pen.delete(m.id); m.error ? p.reject(m.error) : p.resolve(m.result) } } }
      notify(method, p) {
        if (method === "connected") { useStore.setState({ gatewayVersion: p.version, authFailed: false }); const s = useStore.getState(); this.req("register", { channels: [s.channel] }).catch(() => { }); this.fetchInit() }
        else if (method === "auth_failed") { useStore.setState({ authFailed: true, authReason: p.reason || "Auth failed", connecting: false }); this.rt = false }
        else if (method === "stream_chunk") this.onChunk(p)
        else if (method === "response") this.onResponse(p)
        else if (method === "ask_user") useStore.setState(s => ({ askQueue: [...s.askQueue, p] }))
        else if (method === "session.processing_started") { const sk = this.pmap[p.processingId] || p.sessionKey; if (sk) useStore.setState(s => ({ procKeys: { ...s.procKeys, [sk]: p.processingId } })) }
        else if (method === "session.processing_completed") { const sk = this.pmap[p.processingId] || p.sessionKey; if (sk) useStore.setState(s => { const n = { ...s.procKeys }; delete n[sk]; return { procKeys: n } }); delete this.pmap[p.processingId] }
        else if (method === "session.created") this.fetchSessions()
        else if (method === "session.deleted") useStore.setState(s => { const m2 = { ...s.sMsgs }; delete m2[p.sessionKey]; const l = { ...s.sLoaded }; delete l[p.sessionKey]; return { sessions: s.sessions.filter(x => x.key !== p.sessionKey), sMsgs: m2, sLoaded: l, activeSK: s.activeSK === p.sessionKey ? null : s.activeSK } })
      }
      _k(pid, fb) { return this.pmap[pid] || fb }
      onChunk(p) {
        const { processingId: pid, sessionKey: sk, delta, finishReason: fr, toolCallDeltas: tcd } = p
        const lk = this._k(pid, sk); if (!lk) return
        useStore.setState(s => {
          const sm = { ...s.sMsgs }; const msgs = [...(sm[lk] || EMPTY_ARR)]; const idx = msgs.findIndex(m => m.processingId === pid)
          if (idx === -1) { const msg = { id: "m" + Date.now() + Math.random(), role: "assistant", processingId: pid, segments: [], streaming: fr === null, interrupted: fr === "interrupted", error: null, timestamp: Date.now(), queued: false }; if (delta) msg.segments.push({ type: "text", content: delta, streaming: fr === null && !(tcd && tcd.length) }); if (tcd && tcd.length) { if (msg.segments[0]?.type === "text") msg.segments[0].streaming = false; msg.segments.push({ type: "tool_calls", round: 0, calls: tcd.map(tc => ({ index: tc.index, name: tc.functionName || "", id: tc.id || "", arguments: tc.argumentsDelta || "", status: fr === "tool_calls" ? "done" : "calling" })), allDone: fr === "tool_calls" }) } msgs.push(msg) }
          else { const m = { ...msgs[idx], segments: msgs[idx].segments.map(seg => ({ ...seg, ...(seg.type === "tool_calls" ? { calls: seg.calls.map(c => ({ ...c })) } : {}) })) }; if (delta) { const last = m.segments[m.segments.length - 1]; if (last?.type === "text" && last.streaming) last.content += delta; else { if (last?.type === "text") last.streaming = false; m.segments.push({ type: "text", content: delta, streaming: true }) } } if (tcd && tcd.length) { const last = m.segments[m.segments.length - 1]; if (last?.type === "text") last.streaming = false; let ts = m.segments.find(s2 => s2.type === "tool_calls" && !s2.allDone); if (!ts) { ts = { type: "tool_calls", round: m.segments.filter(s2 => s2.type === "tool_calls").length, calls: [], allDone: false }; m.segments.push(ts) } for (const tc of tcd) { const ex = ts.calls.find(c => c.index === tc.index); if (ex) { if (tc.id) ex.id = tc.id; if (tc.functionName) ex.name = tc.functionName; if (tc.argumentsDelta) ex.arguments += tc.argumentsDelta } else ts.calls.push({ index: tc.index, name: tc.functionName || "", id: tc.id || "", arguments: tc.argumentsDelta || "", status: "calling" }) } if (fr === "tool_calls") { ts.calls.forEach(c => c.status = "done"); ts.allDone = true } } m.streaming = fr === null; m.interrupted = fr === "interrupted"; if (fr === "stop" || fr === "interrupted") m.segments.forEach(seg => { if (seg.type === "text") seg.streaming = false; if (seg.type === "tool_calls") { seg.calls.forEach(c => c.status = "done"); seg.allDone = true } }); msgs[idx] = m }
          sm[lk] = msgs; return { sMsgs: sm }
        })
      }
      onResponse(p) {
        const { processingId: pid, response, error } = p; const lk = this._k(pid, p.sessionKey); if (!lk) return
        useStore.setState(s => { const sm = { ...s.sMsgs }; const msgs = [...(sm[lk] || EMPTY_ARR)]; const idx = msgs.findIndex(m => m.processingId === pid); if (idx !== -1) { const m = { ...msgs[idx], segments: msgs[idx].segments.map(seg => ({ ...seg, ...(seg.type === "tool_calls" ? { calls: seg.calls.map(c => ({ ...c })) } : {}) })), streaming: false }; if (error) m.error = error; if (response) { const lt = m.segments.filter(x => x.type === "text").pop(); if (lt) lt.content = response } m.segments.forEach(seg => { if (seg.type === "text") seg.streaming = false; if (seg.type === "tool_calls") { seg.calls.forEach(c => c.status = "done"); seg.allDone = true } }); msgs[idx] = m } sm[lk] = msgs; const nk = { ...s.procKeys }; delete nk[lk]; return { sMsgs: sm, procKeys: nk } }); delete this.pmap[pid]
      }
      async fetchInit() {
        const r = await Promise.allSettled([this.req("listModels"), this.req("listAgents"), this.req("listSkills"), this.req("listTools"), this.req("listSessions"), this.req("getConfig"), this.req("getWorkdir"), this.req("listChannels"), this.req("getCurrentModel"), this.req("listCronJobs"), this.req("listBindings"), this.req("system.stats"), this.req("system.toolStats")])
        const g = (i, d) => r[i].status === "fulfilled" ? r[i].value : d
        const sess = g(4, EMPTY_ARR); useStore.setState({ models: g(0, EMPTY_OBJ), agents: g(1, EMPTY_ARR), skills: g(2, EMPTY_ARR), tools: g(3, EMPTY_ARR), sessions: sess, config: g(5, null), workdir: g(6, null), channels: g(7, EMPTY_ARR), curModel: g(8, null), cron: g(9, EMPTY_ARR), bindings: g(10, EMPTY_ARR), stats: g(11, null), toolStats: g(12, EMPTY_ARR) })
        const st = useStore.getState(); if (!st.activeSK && sess.length > 0) { const sorted = [...sess].sort((a, b) => (b.lastActiveAt || 0) - (a.lastActiveAt || 0)); const sk = sorted[0].key; useStore.setState({ activeSK: sk }); this.loadHist(sk) } else if (sess.length === 0 && st.connected) { try { await this.createSess({}) } catch (e) { console.error("Auto-create session failed:", e) } }
      }
      async fetchSessions() { try { useStore.setState({ sessions: await this.req("listSessions") }) } catch { } }
      async loadHist(sk, limit = 80) { try { const r = await this.req("sessionHistory", { key: sk, limit }); useStore.setState(s => ({ sMsgs: { ...s.sMsgs, [sk]: (r.messages || EMPTY_ARR).filter(e => e.role === "user" || e.role === "assistant").map(env2msg) }, sLoaded: { ...s.sLoaded, [sk]: true } })) } catch { } }
      async send(text) {
        const st = useStore.getState(); let sk = st.activeSK
        if (!sk) { try { const r = await this.createSess({}); sk = r.sessionKey } catch { return } }
        const um = { id: "m" + Date.now() + Math.random(), role: "user", processingId: null, segments: [{ type: "text", content: text, streaming: false }], streaming: false, interrupted: false, error: null, timestamp: Date.now(), queued: false }
        useStore.setState(s => { const m = { ...s.sMsgs }; m[sk] = [...(m[sk] || EMPTY_ARR), um]; return { sMsgs: m, inputText: "" } })
        try {
          const res = await this.req("send", { text, sessionKey: sk, channel: st.channel, peerId: st.peerId }); this.pmap[res.processingId] = res.sessionKey
          if (res.sessionKey && res.sessionKey !== sk) useStore.setState(s => { const m = { ...s.sMsgs }; m[res.sessionKey] = m[sk] || EMPTY_ARR; delete m[sk]; const nk = { ...s.procKeys }; delete nk[sk]; nk[res.sessionKey] = res.processingId; return { sMsgs: m, activeSK: res.sessionKey, procKeys: nk } })
          else useStore.setState(s => ({ procKeys: { ...s.procKeys, [sk]: res.processingId } }))
          if (res.queued) { const tk = res.sessionKey || sk; useStore.setState(s => { const m = { ...s.sMsgs }; m[tk] = (m[tk] || EMPTY_ARR).map(x => x.id === um.id ? { ...x, queued: true } : x); return { sMsgs: m } }) }
        } catch (e) { useStore.setState(s => { const m = { ...s.sMsgs }; m[sk] = (m[sk] || EMPTY_ARR).map(x => x.id === um.id ? { ...x, error: String(e.message || e) } : x); return { sMsgs: m } }) }
      }
      async askRespond(qid, ans) { try { await this.req("askUserRespond", { questionId: qid, answer: ans }); useStore.setState(s => ({ askQueue: s.askQueue.filter(q => q.questionId !== qid) })) } catch { } }
      async createSess(p = {}) { const r = await this.req("session.create", p); await this.fetchSessions(); useStore.setState({ activeSK: r.sessionKey }); await this.loadHist(r.sessionKey); if (p.title) try { await this.req("session.updateMetadata", { sessionKey: r.sessionKey, metadata: { title: p.title } }); await this.fetchSessions() } catch { } return r }
      async delSess(sk) { try { await this.req("session.delete", { sessionKey: sk }) } catch { }; useStore.setState(s => { const m = { ...s.sMsgs }; delete m[sk]; const l = { ...s.sLoaded }; delete l[sk]; const rem = s.sessions.filter(x => x.key !== sk); return { sessions: rem, sMsgs: m, sLoaded: l, activeSK: s.activeSK === sk ? (rem[0]?.key || null) : s.activeSK } }) }
      async forkSess(sk, mid) { const r = await this.req("session.fork", { sessionKey: sk, messageId: mid }); await this.fetchSessions(); useStore.setState({ activeSK: r.newSessionKey }); await this.loadHist(r.newSessionKey); return r }

      return <div className="flex-1 flex flex-col overflow-hidden">
        <div className="navbar bg-base-200 border-b border-base-300 min-h-[46px] px-5"><span className="font-semibold text-lg">System</span><div className="flex-1" /><button className="btn btn-ghost btn-sm gap-1.5" disabled={!connected} onClick={() => gw.req("triggerHeartbeat").catch(() => { })}><Zap size={11} /> Heartbeat</button></div>
        <div className="tabs tabs-boxed bg-base-300 p-0.5 gap-0.5 mx-5 mt-3 w-fit"><button className={cx("tab tab-sm", tab === "config" && "tab-active")} onClick={() => setTab("config")}>Config</button><button className={cx("tab tab-sm", tab === "workdir" && "tab-active")} onClick={() => setTab("workdir")}>Workdir</button><button className={cx("tab tab-sm", tab === "channels" && "tab-active")} onClick={() => setTab("channels")}>Channels</button><button className={cx("tab tab-sm", tab === "cron" && "tab-active")} onClick={() => setTab("cron")}>Cron</button><button className={cx("tab tab-sm", tab === "theme" && "tab-active")} onClick={() => setTab("theme")}>Theme</button></div>
        <div className="flex-1 overflow-y-auto p-5">
          {tab === "config" && (!edCfg ? <>{config ? <pre className="bg-base-200 border border-base-300 rounded-lg p-4 text-xs font-mono overflow-x-auto leading-relaxed max-h-[60vh]">{JSON.stringify(config, null, 2)}</pre> : <div className="opacity-40">No config.</div>}<div className="flex justify-end mt-3"><button className="btn btn-primary btn-sm gap-1.5" onClick={() => setEdCfg(true)}><PenLine size={12} /> Edit</button></div></> : <><textarea className="textarea textarea-bordered w-full font-mono text-xs leading-relaxed" value={cfgTxt} onChange={e => setCfgTxt(e.target.value)} rows={20} style={{ minHeight: 300, resize: "vertical" }} /><div className="flex gap-2 mt-3 justify-end"><button className="btn btn-ghost btn-sm" onClick={() => setEdCfg(false)}>Cancel</button><button className="btn btn-primary btn-sm" onClick={async () => { try { await gw.req("setConfig", { config: JSON.parse(cfgTxt) }); setEdCfg(false); gw.fetchInit() } catch (e) { alert("Invalid: " + (e.message || e)) } }}>Save</button></div></>)}
          {tab === "workdir" && (workdir ? <div className="card bg-base-200 border border-base-300"><div className="card-body p-4">{["workdir", "workspace", "projectWorkspace"].map(k => <div key={k} className="mb-1"><b>{k}:</b> <span className="font-mono bg-base-300 px-1.5 py-0.5 rounded text-xs">{workdir[k]}</span></div>)}</div></div> : <div className="opacity-40">No workdir info.</div>)}
          {tab === "channels" && <><div className="flex gap-3 mb-4"><div className="form-control flex-1"><label className="label py-0.5"><span className="label-text text-xs">Channel</span></label><input className="input input-bordered input-sm" value={ch} onChange={e => useStore.setState({ channel: e.target.value })} /></div><div className="form-control flex-1"><label className="label py-0.5"><span className="label-text text-xs">Peer ID</span></label><input className="input input-bordered input-sm" value={pid} onChange={e => useStore.setState({ peerId: e.target.value })} /></div></div>{chs.length === 0 ? <div className="opacity-40">No channels.</div> : chs.map((c, i) => <div key={i} className="card bg-base-200 border border-base-300 mb-2"><div className="card-body p-3"><span className="font-semibold">{c.id}</span>{c.ephemeral && <span className="badge badge-xs badge-info">ephemeral</span>}</div></div>)}</>}
          {tab === "cron" && <><div className="flex justify-end mb-3"><button className="btn btn-primary btn-sm gap-1.5" disabled={!connected} onClick={() => setCronEd({ id: "cron-" + Date.now(), name: "", enabled: true, scheduleKind: "cron", schedule: "0 * * * *", message: "", nextRunAt: 0 })}><Plus size={10} /> Add</button></div>
            {cronEd && <div className="card bg-base-200 border border-primary mb-3"><div className="card-body p-4"><div className="grid grid-cols-2 gap-3">
              <div className="form-control"><label className="label py-0.5"><span className="label-text text-xs">ID</span></label><input className="input input-bordered input-sm" value={cronEd.id} onChange={e => setCronEd(s => ({ ...s, id: e.target.value }))} /></div>
              <div className="form-control"><label className="label py-0.5"><span className="label-text text-xs">Name</span></label><input className="input input-bordered input-sm" value={cronEd.name} onChange={e => setCronEd(s => ({ ...s, name: e.target.value }))} /></div>
              <div className="form-control"><label className="label py-0.5"><span className="label-text text-xs">Kind</span></label><select className="select select-bordered select-sm" value={cronEd.scheduleKind} onChange={e => setCronEd(s => ({ ...s, scheduleKind: e.target.value }))}><option value="cron">cron</option><option value="at">at</option><option value="every">every</option></select></div>
              <div className="form-control"><label className="label py-0.5"><span className="label-text text-xs">Schedule</span></label><input className="input input-bordered input-sm" value={cronEd.schedule || ""} onChange={e => setCronEd(s => ({ ...s, schedule: e.target.value }))} /></div>
            </div><div className="form-control mt-2"><label className="label py-0.5"><span className="label-text text-xs">Message</span></label><input className="input input-bordered input-sm" value={cronEd.message || ""} onChange={e => setCronEd(s => ({ ...s, message: e.target.value }))} /></div>
              <div className="flex justify-end gap-1.5 mt-3"><button className="btn btn-ghost btn-xs" onClick={() => setCronEd(null)}>Cancel</button><button className="btn btn-primary btn-xs" onClick={async () => { try { const c = await gw.req("getConfig"); c.cronJobs = c.cronJobs || []; const idx = c.cronJobs.findIndex(x => x.id === cronEd.id); if (idx >= 0) c.cronJobs[idx] = cronEd; else c.cronJobs.push(cronEd); await gw.req("setConfig", { config: c }); setCronEd(null); gw.fetchInit() } catch (e) { alert(e.message || e) } }}>Save</button></div></div></div>}
            {cron.map((cj, i) => <div key={i} className="card bg-base-200 border border-base-300 mb-2"><div className="card-body p-3">
              <div className="flex justify-between items-center"><span className="font-semibold">{cj.name || cj.id} {cj.enabled ? <span className="badge badge-xs badge-success">on</span> : <span className="badge badge-xs badge-error">off</span>}</span><div className="flex gap-1"><button className="btn btn-ghost btn-xs" onClick={() => setCronEd({ ...cj })}><PenLine size={10} /></button><button className="btn btn-ghost btn-xs text-error" onClick={async () => { try { const c = await gw.req("getConfig"); c.cronJobs = c.cronJobs.filter(x => x.id !== cj.id); await gw.req("setConfig", { config: c }); gw.fetchInit() } catch { } }}><X size={10} /></button></div></div>
              <div className="text-xs opacity-50">{cj.scheduleKind}: {cj.schedule || "-"} · Next: {cj.nextRunAt ? new Date(cj.nextRunAt).toLocaleString() : "-"}</div>
              <button className="btn btn-primary btn-xs gap-1 mt-2 w-fit" disabled={!connected} onClick={() => gw.req("triggerCron", { id: cj.id }).catch(() => { })}><Play size={10} /> Trigger</button>
            </div></div>)}</>}
          {tab === "theme" && <><div className="text-xs font-semibold uppercase tracking-wider opacity-40 mb-3">Color Theme</div>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-6">{DAISY_THEMES.map(t => <button key={t.id} className={cx("card bg-base-200 border p-3 cursor-pointer transition-all hover:scale-[1.02]", themeId === t.id ? "border-primary" : "border-base-300")} onClick={() => setTheme(t.id)}>
              <div className="flex items-center justify-between mb-1"><span className="font-semibold text-sm">{t.name}</span>{themeId === t.id && <Check size={12} className="text-primary" />}</div>
              <div className="flex gap-1"><span className="w-4 h-4 rounded" style={{ background: `oklch(var(--b1))`, border: "1px solid oklch(var(--b3))" }} /><span className="w-4 h-4 rounded" style={{ background: "oklch(var(--b2))", border: "1px solid oklch(var(--b3))" }} /><span className="w-4 h-4 rounded" style={{ background: "oklch(var(--p))" }} /></div>
            </button>)}</div>
            <div className="text-xs font-semibold uppercase tracking-wider opacity-40 mb-3">Size / Density</div>
            <div className="grid grid-cols-2 gap-2 mb-6">{SIZE_MODES.map(s => <button key={s.id} className={cx("card bg-base-200 border p-3 cursor-pointer transition-all hover:scale-[1.02]", sizeId === s.id ? "border-primary" : "border-base-300")} onClick={() => setSize(s.id)}>
              <div className="flex items-center justify-between"><span className="font-semibold text-sm">{s.name}</span>{sizeId === s.id && <Check size={12} className="text-primary" />}</div>
              <div className="text-xs opacity-40 mt-0.5">Base: {s.id === "compact" ? "12px" : s.id === "default" ? "14px" : s.id === "comfort" ? "16px" : "18px"}</div>
            </button>)}</div></>}
        </div>
      </div>
    }

    /* ═══════ App ═══════ */
    function App() {
      const tab = useStore(s => s.activeTab), connected = useStore(s => s.connected), themeId = useStore(s => s.themeId), sizeId = useStore(s => s.sizeId)
      React.useEffect(() => { applyTheme(themeId); applySize(sizeId) }, [themeId, sizeId])
      React.useEffect(() => {
        const eps = loadEps()
        if (eps.length > 0) {
          useStore.setState({ activeEpId: eps[0].id })
          gw.connect(eps[0].url, eps[0].token).catch(() => { })
        }
        return () => gw.disconnect()
      }, [])
      React.useEffect(() => {
        if (!connected) return
        const iv = setInterval(async () => { try { useStore.setState({ cron: await gw.req("listCronJobs") }) } catch { } }, 3e4)
        return () => clearInterval(iv)
      }, [connected])
      const panels = { chat: ChatPanel, models: ModelsPanel, agents: AgentsPanel, skills: SkillsPanel, tools: ToolsPanel, observe: ObservePanel, system: SystemPanel }
      const Active = panels[tab] || ChatPanel
      return <div className="flex h-screen overflow-hidden">
        <div className="flex flex-col flex-1">
          <TopBar />
          <div className="flex flex-1 overflow-hidden">
            <SideBar />
            <div className="flex-1 flex overflow-hidden"><Active /></div>
          </div>
        </div>
        <LoginScreen />
        <AskModal />
      </div>
    }

    createRoot(document.getElementById("root")).render(<App />)
  </script>
</body>

</html>
